<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>财报疑点放大镜</title>
<style>
  :root {
    --bg: #f5f7fa; --card: #ffffff; --line: #e5e8ee;
    --text: #1f2430; --sub: #6b7280; --accent: #2563eb;
    --fact: #0f766e; --review: #b45309; --spec: #be185d;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; background: var(--bg); color: var(--text); }
  .wrap { max-width: 960px; margin: 0 auto; padding: 24px 16px 64px; }
  header h1 { font-size: 24px; }
  header p { color: var(--sub); margin-top: 6px; font-size: 14px; }
  .panel { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 20px; margin-top: 20px; }
  .form-row { display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-end; }
  .field label { display: block; font-size: 13px; color: var(--sub); margin-bottom: 6px; }
  .field select, .field input { height: 40px; border: 1px solid var(--line); border-radius: 8px; padding: 0 12px; font-size: 14px; min-width: 200px; background: #fff; }
  button.primary { height: 40px; padding: 0 24px; border: 0; border-radius: 8px; background: var(--accent); color: #fff; font-size: 14px; cursor: pointer; }
  button.primary:disabled { opacity: .5; cursor: not-allowed; }
  button.ghost { height: 34px; padding: 0 14px; border: 1px solid var(--line); border-radius: 8px; background: #fff; color: var(--sub); font-size: 13px; cursor: pointer; }
  .note { margin-top: 14px; font-size: 13px; color: var(--sub); line-height: 1.7; }
  .note .warn { color: var(--review); }
  .ev-list { margin-top: 16px; display: flex; flex-direction: column; gap: 12px; }
  .ev-card { border: 1px solid var(--line); border-radius: 10px; padding: 16px; background: #fafbfd; }
  .ev-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .ev-title { font-weight: 600; font-size: 15px; }
  .tag { font-size: 12px; padding: 2px 10px; border-radius: 999px; color: #fff; }
  .tag.fact { background: var(--fact); }
  .tag.review { background: var(--review); }
  .tag.spec { background: var(--spec); }
  .ev-meta { margin-top: 8px; font-size: 12px; color: var(--sub); }
  .ev-detail { margin-top: 8px; font-size: 13px; line-height: 1.7; }
  .ev-quote { margin-top: 8px; padding: 10px 12px; background: #f0f2f5; border-left: 3px solid var(--accent); border-radius: 6px; font-size: 12px; color: #374151; }
  .ev-source { margin-top: 8px; font-size: 12px; color: var(--sub); }
  .ev-actions { margin-top: 12px; display: flex; gap: 8px; align-items: center; }
  .feedback-done { font-size: 12px; color: var(--fact); }
  .msg { margin-top: 16px; padding: 12px 14px; border-radius: 8px; font-size: 14px; }
  .msg.err { background: #fef2f2; color: #991b1b; border: 1px solid #fecaca; }
  .msg.ok { background: #ecfdf5; color: #065f46; border: 1px solid #a7f3d0; }
  .empty { margin-top: 20px; padding: 28px; text-align: center; color: var(--sub); border: 1px dashed var(--line); border-radius: 10px; font-size: 14px; }
  .toolbar { margin-top: 16px; display: flex; gap: 10px; }
  footer { margin-top: 32px; font-size: 12px; color: var(--sub); text-align: center; line-height: 1.8; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>财报疑点放大镜</h1>
    <p>输入 A 股代码与报告期，AI 定位财报疑点并锚定原文证据 —— 只陈列事实，不构成投资建议。</p>
  </header>

  <div class="panel">
    <div class="form-row">
      <div class="field">
        <label>股票代码（A股 6 位）</label>
        <input id="stock" list="stockList" placeholder="如 600519" maxlength="6">
        <datalist id="stockList"></datalist>
      </div>
      <div class="field">
        <label>报告期</label>
        <input id="period" list="periodList" placeholder="如 2025年报" maxlength="16">
        <datalist id="periodList"></datalist>
      </div>
      <button class="primary" id="runBtn">开始审查</button>
    </div>
    <div class="note" id="modeNote">加载中……</div>
  </div>

  <div id="msg"></div>
  <div id="result"></div>

  <footer>
    本产品仅做财报信息疑点筛查与证据陈列，不预测股价、不提供任何买卖建议。<br>
    所有结论请务必结合原文与人工复核后使用。市场有风险，投资需谨慎。
  </footer>
</div>

<script>
const $ = (id) => document.getElementById(id);
const LABEL_CLASS = { "事实确认": "fact", "需要人工复核": "review", "仅推测": "spec" };

async function loadStocks() {
  try {
    const r = await fetch("/api/stocks");
    const data = await r.json();
    $("stockList").innerHTML = data.stocks.map(s => `<option value="${s.code}">${s.name}</option>`).join("");
    $("periodList").innerHTML = data.periods.map(p => `<option value="${p}">${p}</option>`).join("");
    $("stock").value = data.stocks[0] ? data.stocks[0].code : "";
    $("period").value = data.periods[0] || "";
    const h = await (await fetch("/api/health")).json();
    const modeText = h.data_mode === "demo"
      ? "当前为演示模式：仅支持演示库标的（600519/000001/300750），数据为内置构造数据，输出会明确标注。"
      : h.data_mode === "real"
        ? "当前为真实数据模式（real）：数据全部来自扶摇 API，失败即报错、不降级。"
        : "当前为自动模式（auto）：优先调用扶摇真实数据，失败自动降级为演示数据并标注。";
    const llmText = h.llm ? "LLM 已配置，文本-数字一致性校验可用。" : "LLM 未配置，文本-数字一致性校验不可用（规则引擎模式）。";
    $("modeNote").innerHTML = modeText + "<br>" + llmText;
  } catch (e) {
    $("modeNote").textContent = "初始化失败：" + e.message;
  }
}

function showMsg(type, text) { $("msg").innerHTML = `<div class="msg ${type}">${text}</div>`; }

function render(result) {
  const box = $("result");
  const evs = result.evidence || [];
  const notes = (result.notes || []).map(n => `<div>· ${n}</div>`).join("");

  if (!evs.length) {
    box.innerHTML = `<div class="empty">未识别出明显疑点。<br>${notes || "数据完整且检查器全部执行。"}</div>`;
    return;
  }

  box.innerHTML = `
    <div class="panel">
      <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px">
        <strong>疑点清单（${evs.length} 条）</strong>
        <button class="ghost" onclick="exportReport()">导出审查报告</button>
      </div>
      <div class="note">${notes}</div>
      <div class="ev-list">${evs.map(ev => card(ev)).join("")}</div>
    </div>`;
}

function card(ev) {
  const cls = LABEL_CLASS[ev.label] || "review";
  const feedbackState = ev.feedback
    ? `<span class="feedback-done">已标记：${ev.feedback === "confirmed" ? "确认疑点" : "AI 误报"}</span>`
    : `<button class="ghost" onclick="feedback('${ev.id}','confirmed')">确认疑点</button>
       <button class="ghost" onclick="feedback('${ev.id}','false_positive')">标记 AI 误报</button>`;
  return `
    <div class="ev-card" id="${ev.id}">
      <div class="ev-head">
        <span class="ev-title">${ev.title}</span>
        <span class="tag ${cls}">${ev.label}</span>
      </div>
      <div class="ev-meta">指标：${ev.metric} ｜ 对比基准：${ev.baseline}</div>
      <div class="ev-detail">${ev.detail}</div>
      <div class="ev-quote">原文证据：${ev.quote || "（无直接原文引用，本项仅为推测，请谨慎对待）"}</div>
      <div class="ev-source">来源：${ev.source}</div>
      <div class="ev-actions" id="act-${ev.id}">${feedbackState}</div>
    </div>`;
}

async function run() {
  const btn = $("runBtn");
  // TC-13 前置校验：空表单/格式非法直接拦截，不发起请求
  const code = ($("stock").value || "").trim();
  const period = ($("period").value || "").trim();
  if (!code || !period) {
    showMsg("err", "请填写股票代码和报告期。");
    return;
  }
  if (!/^\d{6}$/.test(code)) {
    showMsg("err", "股票代码需为 6 位数字，例如 600519。");
    return;
  }
  btn.disabled = true; btn.textContent = "审查中……";
  showMsg("", "");
  $("result").innerHTML = "";
  try {
    const r = await fetch("/api/analyze", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ stock_code: $("stock").value, report_period: $("period").value }),
    });
    const data = await r.json();
    if (!r.ok) {
      showMsg("err", (data.detail || "请求失败") + " —— 未生成任何疑点，避免静默给出结论。");
      return;
    }
    render(data);
  } catch (e) {
    showMsg("err", "网络异常：" + e.message + " —— 未生成任何疑点。");
  } finally {
    btn.disabled = false; btn.textContent = "开始审查";
  }
}

async function feedback(id, action) {
  try {
    await fetch("/api/feedback", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ evidence_id: id, action }),
    });
    const box = document.getElementById("act-" + id);
    if (box) {
      box.innerHTML = `<span class="feedback-done">已标记：${action === "confirmed" ? "确认疑点" : "AI 误报"}</span>`;
      box.closest(".ev-card").style.borderLeft = action === "confirmed" ? "3px solid #0f766e" : "3px solid #be185d";
    }
  } catch (e) { alert("反馈提交失败：" + e.message); }
}

function exportReport() {
  const box = $("result");
  const text = box.innerText || "";
  const blob = new Blob([text], { type: "text/plain;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "财报疑点审查报告.txt";
  a.click();
  URL.revokeObjectURL(a.href);
}

$("runBtn").addEventListener("click", run);
loadStocks();
</script>
</body>
</html>
